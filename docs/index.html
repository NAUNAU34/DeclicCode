<style>
/* Layout : une seule colonne étroite façon application, une seule chose à faire par écran. */
:root{
  --bg:#f1f4fb; --surface:#ffffff; --ink:#141a33; --muted:#566080; --line:#d6dcee; --soft:#e6eaf6;
  --code-bg:#121831; --code-fg:#e8ecfb; --code-key:#ffb86b; --code-str:#9be28f; --code-num:#8fd3ff; --code-com:#8c95b8;
  --ok:#157a43; --ok-bg:#dff5e8; --bad:#b93127; --bad-bg:#fbe4e1; --gold:#c98a00;
  --js:#f2c230; --js-on:#221b00; --py:#2c6cb5; --py-on:#ffffff; --cs:#7440cf; --cs-on:#ffffff;
  --lang:var(--py); --on-lang:var(--py-on);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1226; --surface:#182040; --ink:#eef1fc; --muted:#a4adcf; --line:#2e3962; --soft:#222c52;
  --code-bg:#080c1c; --ok:#5fd693; --ok-bg:#123524; --bad:#ff8d82; --bad-bg:#44191a; --gold:#ffc94a;
  --py:#5a9be6; --py-on:#06162b; --cs:#a47cf2; --cs-on:#140a2e; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d1226; --surface:#182040; --ink:#eef1fc; --muted:#a4adcf; --line:#2e3962; --soft:#222c52;
  --code-bg:#080c1c; --ok:#5fd693; --ok-bg:#123524; --bad:#ff8d82; --bad-bg:#44191a; --gold:#ffc94a;
  --py:#5a9be6; --py-on:#06162b; --cs:#a47cf2; --cs-on:#140a2e; color-scheme:dark }
.lang-js{--lang:var(--js);--on-lang:var(--js-on)}
.lang-py{--lang:var(--py);--on-lang:var(--py-on)}
.lang-cs{--lang:var(--cs);--on-lang:var(--cs-on)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
#app{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--lang);outline-offset:2px}
code{font-family:var(--mono);font-size:.88em;background:var(--soft);padding:.1em .35em;border-radius:5px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.label{font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}

/* Barre du haut */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;margin-right:auto}
.brand b{background:var(--lang);color:var(--on-lang);padding:.05em .4em;border-radius:6px;margin-right:.3em}
.chip{font-size:.85rem;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:.25em .8em;background:var(--surface);font-variant-numeric:tabular-nums}
.chip.btnlike{cursor:pointer}
.xp{display:flex;flex-direction:column;gap:6px}
.xp .row{display:flex;justify-content:space-between;font-size:.88rem;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lang);border-radius:999px;transition:width .35s ease}

/* Choix du langage */
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.langbtn{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.langbtn strong{font-family:var(--display);font-size:1.05rem}
.langbtn span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.langbtn[aria-pressed="true"]{background:var(--lang);color:var(--on-lang);border-color:var(--lang)}
.langbtn[aria-pressed="true"] span{color:inherit}

/* Boutons */
.btn{background:var(--lang);color:var(--on-lang);border:0;border-radius:14px;padding:14px 20px;font-weight:700;font-size:1.05rem;width:100%;box-shadow:0 4px 0 color-mix(in srgb,var(--lang) 60%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--lang) 60%,#000)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.cta{text-align:left;display:flex;flex-direction:column;gap:2px}
.cta small{font-weight:400;font-size:.88rem;opacity:.85}
.rowbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.rowbtns{grid-template-columns:1fr}}

/* Liste des leçons */
.path{display:flex;flex-direction:column;gap:8px}
.lesson{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.lesson .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--soft)}
.lesson.done .num{background:var(--lang);color:var(--on-lang)}
.lesson .name{flex:1;min-width:0;font-weight:700}
.lesson .meta{flex:none;font-size:.85rem;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:.1em;font-size:1rem}
.lesson.next{border-color:var(--lang);border-width:2.5px}

details{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
summary{font-weight:700;cursor:pointer}
details ol,details ul{margin:.6em 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:.4em}

/* Écran de leçon */
.lessonbar{display:flex;align-items:center;gap:10px}
.lessonbar .bar{flex:1}
.quit{background:none;border:0;font-size:.9rem;font-weight:700;color:var(--muted);padding:6px 2px}
.combo{font-size:.85rem;font-weight:700;color:var(--gold);min-width:5.5em;text-align:right;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;animation:in .22s ease}
@keyframes in{from{transform:translateY(8px)}to{transform:none}}
.kind{font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}
.q{font-size:1.2rem}
pre{margin:0;background:var(--code-bg);color:var(--code-fg);font-family:var(--mono);font-size:.9rem;line-height:1.6;padding:14px 16px;border-radius:12px;overflow-x:auto;max-width:100%}
.tk{color:var(--code-key)} .ts{color:var(--code-str)} .tn{color:var(--code-num)} .tc{color:var(--code-com)}
.slot{display:inline-block;min-width:2.6em;text-align:center;border:2px dashed var(--code-key);border-radius:6px;color:var(--code-key);padding:0 .4em}
.out{border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;font-family:var(--mono);font-size:.9rem;white-space:pre-wrap}
.out::before{content:"Ce qui s’affiche";display:block;font-family:var(--body);font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);margin-bottom:4px}
.tip{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:.95rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.opts:not(.two){grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px;text-align:left;min-width:0;font-weight:700}
.opt.mono{font-family:var(--mono);font-size:.92rem;font-weight:400}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.key{flex:none;width:24px;height:24px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-family:var(--body);font-size:.78rem;font-weight:700;color:var(--muted)}
.opt:not(:disabled):hover,.line:not(:disabled):hover{border-color:var(--lang)}
.opt.good,.line.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad,.line.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled,.line:disabled{cursor:default}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:9px 12px;text-align:left;min-width:0;overflow-x:auto}
.line code{background:none;padding:0;white-space:pre;font-size:.86rem;overflow-wrap:normal;color:var(--ink)}
.line .tk{color:var(--lang-ink,var(--ink));font-weight:700} .line .ts{color:var(--ok)} .line .tn{color:var(--ink)} .line .tc{color:var(--muted)}
.ln{flex:none;font-size:.78rem;font-weight:700;color:var(--muted);width:1.2em;font-variant-numeric:tabular-nums}
.codein{width:100%;font-family:var(--mono);font-size:1rem;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.codein:focus{outline:3px solid var(--lang);outline-offset:1px}
.codein.good{border-color:var(--ok);background:var(--ok-bg)} .codein.bad{border-color:var(--bad);background:var(--bad-bg)}
.symkeys{display:flex;flex-wrap:wrap;gap:6px}
.sym{font-family:var(--mono);font-size:1rem;min-width:40px;height:40px;border:1.5px solid var(--line);border-radius:9px;background:var(--soft)}
.answer{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px}
.answer.good{border-color:var(--ok)} .answer.bad{border-color:var(--bad)}
.hint{color:var(--muted);font-size:.92rem;padding:6px}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-bg)} .fb.ko{background:var(--bad-bg)}
.fb h3{font-size:1.1rem}
.fb.ok h3{color:var(--ok)} .fb.ko h3{color:var(--bad)}

/* Fin de leçon */
.end{text-align:center;align-items:center}
.end .stars{font-size:2.6rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{background:var(--soft);border-radius:12px;padding:10px 6px}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.timer{font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ========================= CONTENU ========================= */
// Exercices. La première option est toujours la bonne réponse (elles sont mélangées à l’affichage).
const q=(qu,c,o,w)=>({t:'q',q:qu,c,o,w});      // choix multiple
const t=(qu,c,o,w)=>({t:'t',q:qu,c,o,w});      // compléter le trou ___
const v=(qu,c,a,w)=>({t:'v',q:qu,c,a,w});      // vrai ou faux
const b=(qu,l,a,w)=>({t:'b',q:qu,l,a,w});      // trouver la ligne avec l’erreur
const o=(qu,l,w)=>({t:'o',q:qu,l,w});          // remettre les lignes dans l’ordre
const w=(qu,c,ok,why)=>({t:'w',q:qu,c,ok,w:why}); // écrire une ligne de code (ok = réponses acceptées)

const LANGS={js:'JavaScript',py:'Python',cs:'C#'};
const TITLES=['Afficher un message','Les variables','Les types de valeurs','Les calculs','Texte et variables','Les conditions','Les boucles','Les listes','Les fonctions'];

// Carte d’introduction commune aux trois langages, une par leçon.
const INTRO=[
 {h:'Un programme, c’est une recette',p:['Un programme est une liste d’instructions. L’ordinateur les lit une par une, de haut en bas, comme on suit une recette de cuisine.','La toute première instruction à connaître : afficher un message à l’écran.']},
 {h:'Une variable, c’est une boîte',p:['Une variable est une boîte avec une étiquette. L’étiquette, c’est son **nom**. Dans la boîte, il y a une **valeur**.','On peut regarder ce qu’il y a dedans, ou remplacer la valeur par une autre.','Attention : en programmation, le signe `=` ne veut pas dire « est égal à ». Il veut dire « range cette valeur dans la boîte ».']},
 {h:'Trois familles de valeurs',p:['Toutes les valeurs n’ont pas la même nature. Il y a trois grandes familles :','**Les nombres** : 25 ou 9.99 (on écrit un point, pas une virgule).','**Le texte** : toujours entre guillemets, comme "Léa". On appelle ça une chaîne de caractères.','**Les booléens** : seulement deux valeurs possibles, vrai ou faux.']},
 {h:'L’ordinateur est une calculatrice',p:['Les signes de calcul : `+` additionne, `-` soustrait, `*` multiplie, `/` divise.','Le signe `%` donne le **reste** d’une division. Exemple : `7 % 2` vaut 1, car 7 = 3 × 2 + 1.','Comme en maths, les multiplications et les divisions passent avant les additions : `2 + 3 * 4` vaut 14, pas 20.']},
 {h:'Mettre une variable dans une phrase',p:['Souvent, on veut afficher une phrase qui contient la valeur d’une variable : « Bonjour Léa », « Score : 12 ».','Il y a deux façons : coller les morceaux avec `+`, ou écrire un texte à trous que l’ordinateur remplit tout seul.']},
 {h:'Une condition, c’est un aiguillage',p:['Jusqu’ici, le programme exécutait toutes les lignes. Avec une condition, il choisit : **si** quelque chose est vrai, il fait une chose, **sinon** il en fait une autre.','Exemple de la vie : s’il pleut, je prends un parapluie, sinon je prends mes lunettes de soleil.']},
 {h:'Une boucle répète à ta place',p:['Pour afficher 100 fois un message, on ne recopie pas 100 lignes. On écrit une **boucle** : un bloc de code que l’ordinateur répète.','Deux sortes de boucles : `for` quand on sait combien de fois répéter, `while` pour répéter **tant qu’**une condition est vraie.']},
 {h:'Une liste range plusieurs valeurs',p:['Une variable contient une seule valeur. Une **liste** en contient plusieurs, rangées dans l’ordre, comme les wagons d’un train.','Chaque valeur a un numéro de place, appelé **index**. Piège très connu : on compte à partir de **0**. Le premier élément est à l’index 0, le deuxième à l’index 1.']},
 {h:'Une fonction, c’est une machine',p:['Une fonction est un morceau de code auquel on donne un nom, pour le réutiliser autant de fois qu’on veut.','Imagine une machine : on lui donne des ingrédients (les **paramètres**), elle travaille, puis elle **renvoie** un résultat.','Deux étapes à ne pas confondre : **créer** la fonction (on construit la machine) et **appeler** la fonction (on appuie sur le bouton). Une fonction jamais appelée ne fait rien.']}
];

const DATA={
/* ---------------- JAVASCRIPT ---------------- */
js:[
 {cards:[
  {h:'Afficher avec console.log',p:['Pour afficher un message, on écrit `console.log`, puis le message entre parenthèses.','Le texte se met toujours entre guillemets. On termine l’instruction par un point-virgule.'],code:['console.log("Bonjour !");'],out:['Bonjour !']},
  {h:'Les commentaires',p:['Une ligne qui commence par `//` est un commentaire : une note pour les humains. L’ordinateur l’ignore complètement.'],code:['// Cette ligne est ignorée','console.log("Celle-ci est exécutée");'],out:['Celle-ci est exécutée']}],
 ex:[
  q('Que va afficher ce code ?',['console.log("Salut");'],['Salut','"Salut"','console.log','Rien du tout'],'Les guillemets servent à délimiter le texte dans le code. Ils ne sont pas affichés.'),
  t('Complète pour afficher Coucou.',['console.___("Coucou");'],['log','print','write','show'],'En JavaScript, l’instruction pour afficher est `console.log`.'),
  b('Une ligne contient une erreur. Laquelle ?',['console.log("Un");','console.log(Deux);','console.log("Trois");'],1,'Il manque les guillemets autour de Deux. Sans guillemets, l’ordinateur croit que Deux est un nom de variable, et cette variable n’existe pas.'),
  o('Remets les lignes dans l’ordre pour afficher 1, puis 2, puis 3.',['console.log("1");','console.log("2");','console.log("3");'],'L’ordinateur exécute les lignes de haut en bas.'),
  q('Que va afficher ce code ?',['// console.log("A");','console.log("B");'],['B','A','A puis B','Rien du tout'],'La première ligne commence par `//` : c’est un commentaire, elle est ignorée.'),
  v('L’ordinateur exécute les instructions de haut en bas, dans l’ordre où elles sont écrites.',null,true,'Oui, exactement comme une recette qu’on suit étape par étape.')]},

 {cards:[
  {h:'Créer une variable avec let',p:['Le mot `let` crée la boîte. On écrit ensuite son nom, le signe `=`, puis la valeur à ranger dedans.','Pour utiliser la valeur, on écrit simplement le nom de la variable, **sans guillemets**.'],code:['let age = 25;','console.log(age);'],out:['25']},
  {h:'Changer la valeur',p:['Pour remplacer la valeur, on réécrit le nom, le signe `=` et la nouvelle valeur. Pas besoin de répéter `let`.','Si la valeur ne doit jamais changer, on crée la variable avec `const` à la place de `let`.'],code:['let score = 10;','score = 20;','console.log(score);'],out:['20']}],
 ex:[
  q('Que va afficher ce code ?',['let score = 10;','score = 20;','console.log(score);'],['20','10','30','score'],'La deuxième ligne remplace 10 par 20 dans la boîte score.'),
  t('Complète pour créer la variable prenom.',['___ prenom = "Léa";'],['let','variable','box','make'],'`let` est le mot qui crée une variable en JavaScript.'),
  q('Que va afficher ce code ?',['let ville = "Paris";','console.log("ville");'],['ville','Paris','"Paris"','Une erreur'],'Avec des guillemets, "ville" est un simple texte. Pour afficher le contenu de la variable, il faut écrire ville sans guillemets.'),
  b('Une ligne contient une erreur. Laquelle ?',['let points = 5;','points = 8;','console.log(point);'],2,'La variable s’appelle points, avec un s. Le nom doit être écrit exactement pareil partout.'),
  v('Avec const, on peut donner une nouvelle valeur à la variable plus tard (par exemple score = 20).',null,false,'Une variable créée avec `const` garde sa valeur pour toujours. Essayer de la changer provoque une erreur.')]},

 {cards:[
  {h:'Les trois familles en JavaScript',p:['En JavaScript, vrai s’écrit `true` et faux s’écrit `false`, sans guillemets.'],code:['let age = 25;','let prix = 9.99;','let prenom = "Léa";','let majeur = true;']},
  {h:'Le piège du texte',p:['Entre deux nombres, `+` additionne. Entre deux textes, `+` les colle bout à bout.','"2" avec des guillemets est un texte, pas un nombre.'],code:['console.log(2 + 3);','console.log("2" + "3");'],out:['5','23']}],
 ex:[
  q('Quelle est la famille de la valeur true ?',null,['Booléen','Nombre','Texte','Commentaire'],'Un booléen ne peut valoir que `true` (vrai) ou `false` (faux).'),
  q('Que va afficher ce code ?',['console.log("2" + "3");'],['23','5','2 + 3','Une erreur'],'Ce sont deux textes : `+` les colle bout à bout.'),
  q('Que va afficher ce code ?',['console.log(2 + 3);'],['5','23','2 + 3','Une erreur'],'Ce sont deux nombres : `+` les additionne.'),
  q('Laquelle de ces valeurs est un texte ?',null,['"42"','42','true','4.2'],'Ce qui est entre guillemets est toujours un texte, même si ça ressemble à un nombre.'),
  v('Dans le code, un nombre à virgule s’écrit avec un point : 9.99',null,true,'Oui. La virgule sert à autre chose dans le code, on utilise donc le point.')]},

 {cards:[
  {h:'Calculer en JavaScript',p:['La division donne un résultat à virgule quand il le faut : `7 / 2` vaut 3.5.'],code:['console.log(7 / 2);','console.log(7 % 2);','console.log(2 + 3 * 4);'],out:['3.5','1','14']},
  {h:'Modifier une variable avec un calcul',p:['`score = score + 5` se lit de droite à gauche : on prend la valeur actuelle, on ajoute 5, puis on range le résultat dans la même boîte.','`score += 5` fait exactement la même chose, en plus court.'],code:['let score = 10;','score = score + 5;','score += 5;','console.log(score);'],out:['20']}],
 ex:[
  q('Que va afficher ce code ?',['console.log(2 + 3 * 4);'],['14','20','24','9'],'La multiplication passe en premier : 3 × 4 = 12, puis 2 + 12 = 14.'),
  q('Que va afficher ce code ?',['console.log(7 % 2);'],['1','3.5','3','0'],'`%` donne le reste de la division : 7 = 3 × 2 + 1, il reste 1.'),

  t('On veut que moitie vaille 5. Quel signe faut-il ?',['let moitie = 10 ___ 2;'],['/','*','%','-'],'10 divisé par 2 donne 5. Le signe de la division est `/`.'),

 {cards:[
  {h:'Coller avec +',p:['Le signe `+` colle un texte et une variable. Pense à mettre l’espace à l’intérieur des guillemets, sinon les mots seront collés.'],code:['let prenom = "Léa";','console.log("Bonjour " + prenom);'],out:['Bonjour Léa']},
  {h:'Le texte à trous',p:['On entoure le texte avec des **accents graves** à la place des guillemets (sur un clavier français Windows : AltGr + 7).','À l’intérieur, `${nom}` est remplacé par la valeur de la variable.'],code:['let age = 20;','console.log(`Tu as ${age} ans`);'],out:['Tu as 20 ans']}],
 ex:[
  q('Que va afficher ce code ?',['let p = "Tom";','console.log("Salut " + p);'],['Salut Tom','Salut p','SalutTom','Salut + Tom'],'`+` colle le texte "Salut " (avec son espace) et la valeur de p.'),
  q('Que va afficher ce code ?',['let age = 20;','console.log(`Tu as ${age} ans`);'],['Tu as 20 ans','Tu as ${age} ans','Tu as age ans','Une erreur'],'Entre accents graves, `${age}` est remplacé par la valeur de age.'),
  q('Attention aux guillemets. Que va afficher ce code ?',['let age = 20;','console.log("Tu as ${age} ans");'],['Tu as ${age} ans','Tu as 20 ans','Tu as age ans','Une erreur'],'Avec des guillemets normaux, rien n’est remplacé. Le remplacement ne marche qu’avec les accents graves.'),
  t('Complète pour afficher la valeur de score.',['let score = 12;','console.log(`Score : ___`);'],['${score}','{score}','$score','(score)'],'La forme complète est un dollar puis des accolades : `${score}`.'),
  q('Que va afficher ce code ?',['console.log("Age : " + 25);'],['Age : 25','Age : + 25','25','Une erreur'],'JavaScript transforme tout seul le nombre 25 en texte pour le coller.')]},

 {cards:[
  {h:'if et else',p:['Entre parenthèses : la question posée. Entre accolades `{ }` : ce qu’il faut faire si la réponse est oui.','Après `else` (sinon) : ce qu’il faut faire si la réponse est non.'],code:['let age = 18;','if (age >= 18) {','  console.log("Majeur");','} else {','  console.log("Mineur");','}'],out:['Majeur']},
  {h:'Poser une question',p:['`>` plus grand, `<` plus petit, `>=` plus grand ou égal, `<=` plus petit ou égal.','`===` teste si deux valeurs sont égales. `!==` teste si elles sont différentes.','Ne confonds pas : un seul `=` range une valeur dans une boîte, trois `===` posent une question.']},
  {h:'Plus de deux chemins',p:['Avec `else if` (sinon si), on ajoute d’autres questions. L’ordinateur s’arrête à la première réponse vraie et ignore la suite.'],code:['let t = 20;','if (t > 30) {','  console.log("Chaud");','} else if (t > 15) {','  console.log("Doux");','} else {','  console.log("Froid");','}'],out:['Doux']}],
 ex:[
  q('Que va afficher ce code ?',['let note = 12;','if (note >= 10) {','  console.log("Réussi");','} else {','  console.log("Raté");','}'],['Réussi','Raté','Réussi puis Raté','Rien du tout'],'12 est plus grand ou égal à 10 : la condition est vraie, on exécute le premier bloc seulement.'),
  t('On veut tester si age est égal à 18.',['if (age ___ 18) {'],['===','=','<>','!=='],'`===` pose la question « est-ce égal ? ». Un seul `=` rangerait 18 dans age.'),
  q('Que va afficher ce code ?',['let t = 5;','if (t > 30) {','  console.log("Chaud");','} else if (t > 15) {','  console.log("Doux");','} else {','  console.log("Froid");','}'],['Froid','Doux','Chaud','Rien du tout'],'5 n’est pas plus grand que 30, ni plus grand que 15. On arrive donc dans le else.'),
  q('Que va afficher ce code ?',['console.log(5 > 3);'],['true','false','5','2'],'Une comparaison donne un booléen. 5 est bien plus grand que 3, donc `true`.'),
  o('S’il pleut, on affiche Parapluie, sinon Lunettes. Remets les lignes dans l’ordre.',['let pluie = true;','if (pluie === true) {','  console.log("Parapluie");','} else {','  console.log("Lunettes");','}'],'On crée d’abord la variable, puis on pose la question, puis vient le cas « oui », et enfin le cas « sinon ».')]},

 {cards:[
  {h:'La boucle for',p:['Entre parenthèses, trois morceaux séparés par des points-virgules :','`let i = 1` : on démarre un compteur à 1.','`i <= 3` : on continue tant que le compteur ne dépasse pas 3.','`i++` : après chaque tour, on ajoute 1 au compteur.'],code:['for (let i = 1; i <= 3; i++) {','  console.log(i);','}'],out:['1','2','3']},
  {h:'La boucle while',p:['`while` répète le bloc tant que la condition est vraie.','Il faut que quelque chose change à chaque tour (ici n diminue). Sinon la condition reste vraie pour toujours et la boucle ne s’arrête jamais.'],code:['let n = 3;','while (n > 0) {','  console.log(n);','  n = n - 1;','}'],out:['3','2','1']}],
 ex:[
  q('Combien de fois Hop va-t-il s’afficher ?',['for (let i = 0; i < 4; i++) {','  console.log("Hop");','}'],['4 fois','3 fois','5 fois','1 fois'],'Le compteur vaut 0, 1, 2 puis 3 : ça fait 4 tours. À 4, la condition i < 4 devient fausse.'),
  q('Que va afficher ce code ? (un nombre par ligne)',['for (let i = 1; i <= 3; i++) {','  console.log(i);','}'],['1 2 3','0 1 2','1 2 3 4','3 3 3'],'Le compteur démarre à 1 et s’arrête après 3.'),
  q('Que va afficher ce code ? (un nombre par ligne)',['let n = 3;','while (n > 0) {','  console.log(n);','  n = n - 1;','}'],['3 2 1','3 2 1 0','1 2 3','3 3 3 sans fin'],'On affiche n puis on enlève 1. Quand n vaut 0, la condition n > 0 est fausse : on s’arrête sans afficher 0.'),
  t('Complète pour ajouter 1 au compteur à chaque tour.',['for (let i = 0; i < 5; i___) {'],['++','--','==','**'],'`i++` veut dire « ajoute 1 à i ».'),
  q('Que va afficher ce code ?',['let total = 0;','for (let i = 1; i <= 3; i++) {','  total = total + i;','}','console.log(total);'],['6','3','123','0'],'À chaque tour on ajoute le compteur au total : 0 + 1 + 2 + 3 = 6.'),
  v('Une boucle while dont la condition reste toujours vraie ne s’arrête jamais.',null,true,'On appelle ça une boucle infinie. Il faut toujours vérifier que la condition finira par devenir fausse.')]},

 {cards:[
  {h:'Créer une liste',p:['On met les valeurs entre crochets `[ ]`, séparées par des virgules.','Pour lire un élément, on écrit le nom de la liste puis son index entre crochets.','`.length` donne le nombre d’éléments.'],code:['let fruits = ["pomme", "banane", "kiwi"];','console.log(fruits[0]);','console.log(fruits.length);'],out:['pomme','3']},
  {h:'Ajouter et parcourir',p:['`.push(valeur)` ajoute un élément à la fin de la liste.','`for (let fruit of fruits)` fait un tour de boucle pour chaque élément. À chaque tour, la variable fruit contient l’élément suivant.'],code:['let fruits = ["pomme", "banane"];','fruits.push("kiwi");','for (let fruit of fruits) {','  console.log(fruit);','}'],out:['pomme','banane','kiwi']}],
 ex:[
  q('Que va afficher ce code ?',['let f = ["pomme", "banane", "kiwi"];','console.log(f[1]);'],['banane','pomme','kiwi','Une erreur'],'On compte à partir de 0 : l’index 1 est le deuxième élément.'),
  q('Que va afficher ce code ?',['let f = ["pomme", "banane", "kiwi"];','console.log(f.length);'],['3','2','4','kiwi'],'`.length` donne le nombre d’éléments : il y en a 3.'),
  t('Complète pour ajouter fraise à la fin de la liste.',['fruits.___("fraise");'],['push','add','append','plus'],'En JavaScript, on ajoute à la fin d’une liste avec `.push`.'),
  q('Que va afficher ce code ?',['let n = [10, 20];','n.push(30);','console.log(n[2]);'],['30','20','10','Une erreur'],'Après push, la liste contient 10, 20, 30. L’index 2 est le troisième élément.'),
  q('Dans une liste de 3 éléments, quel est l’index du dernier ?',null,['2','3','1','0'],'Les index sont 0, 1 et 2. Le dernier index vaut toujours le nombre d’éléments moins 1.'),
  q('Combien de fois Miam va-t-il s’afficher ?',['let plats = ["riz", "pâtes", "soupe"];','for (let plat of plats) {','  console.log("Miam");','}'],['3 fois','1 fois','2 fois','4 fois'],'La boucle fait un tour par élément, et la liste en contient 3.')]},

 {cards:[
  {h:'Créer et appeler une fonction',p:['`function` crée la fonction. Ensuite viennent son nom, puis ses paramètres entre parenthèses.','`return` renvoie le résultat.','Pour l’utiliser, on écrit son nom avec une valeur entre parenthèses : `doubler(4)`.'],code:['function doubler(n) {','  return n * 2;','}','console.log(doubler(4));'],out:['8']},
  {h:'Plusieurs paramètres, plusieurs appels',p:['On sépare les paramètres par des virgules. On peut appeler la même fonction autant de fois qu’on veut, avec des valeurs différentes.'],code:['function ajouter(a, b) {','  return a + b;','}','console.log(ajouter(2, 3));','console.log(ajouter(10, 1));'],out:['5','11']}],
 ex:[
  q('Que va afficher ce code ?',['function ajouter(a, b) {','  return a + b;','}','console.log(ajouter(2, 3));'],['5','23','a + b','Rien du tout'],'a reçoit 2, b reçoit 3, et la fonction renvoie 2 + 3.'),
  t('Complète pour créer la fonction.',['___ direBonjour() {','  console.log("Bonjour");','}'],['function','def','func','void'],'En JavaScript, on crée une fonction avec le mot `function`.'),
  q('Que va afficher ce code ?',['function saluer() {','  console.log("Salut");','}'],['Rien du tout','Salut','saluer','Une erreur'],'La fonction est créée mais jamais appelée. Il faudrait ajouter la ligne saluer(); pour qu’elle s’exécute.'),
  t('Complète pour que la fonction renvoie le double de n.',['function doubler(n) {','  ___ n * 2;','}'],['return','renvoie','give','back'],'`return` est le mot qui renvoie le résultat de la fonction.'),
  q('Que va afficher ce code ?',['function carre(n) {','  return n * n;','}','console.log(carre(3) + 1);'],['10','9','7','31'],'carre(3) renvoie 3 × 3 = 9, puis on ajoute 1.')]}
],

py:[
 {cards:[
  {h:'Afficher avec print',p:['Pour afficher un message, on écrit `print`, puis le message entre parenthèses.','Le texte se met toujours entre guillemets. En Python, pas de point-virgule : une instruction par ligne.'],code:['print("Bonjour !")'],out:['Bonjour !']},
  {h:'Les commentaires',p:['Une ligne qui commence par `#` est un commentaire : une note pour les humains. L’ordinateur l’ignore complètement.'],code:['# Cette ligne est ignorée','print("Celle-ci est exécutée")'],out:['Celle-ci est exécutée']}],
 ex:[
  q('Que va afficher ce code ?',['print("Salut")'],['Salut','"Salut"','print','Rien du tout'],'Les guillemets servent à délimiter le texte dans le code. Ils ne sont pas affichés.'),
  t('Complète pour afficher Coucou.',['___("Coucou")'],['print','echo','console.log','say'],'En Python, l’instruction pour afficher est `print`.'),
  b('Une ligne contient une erreur. Laquelle ?',['print("Un")','print("Deux)','print("Trois")'],1,'Il manque le guillemet de fermeture après Deux. Un texte doit commencer et finir par un guillemet.'),
  o('Remets les lignes dans l’ordre pour afficher 1, puis 2, puis 3.',['print("1")','print("2")','print("3")'],'L’ordinateur exécute les lignes de haut en bas.'),
  q('Que va afficher ce code ?',['# print("A")','print("B")'],['B','A','A puis B','Rien du tout'],'La première ligne commence par `#` : c’est un commentaire, elle est ignorée.'),
  v('En Python, il faut terminer chaque ligne par un point-virgule.',null,false,'Non. En Python, on passe simplement à la ligne suivante.')]},

  {h:'Changer la valeur',p:['Pour remplacer la valeur, on réécrit le nom, le signe `=` et la nouvelle valeur. L’ancienne valeur est oubliée.'],code:['score = 10','score = 20','print(score)'],out:['20']}],

  q('Que va afficher ce code ?',['ville = "Paris"','print("ville")'],['ville','Paris','"Paris"','Une erreur'],'Avec des guillemets, "ville" est un simple texte. Pour afficher le contenu de la variable, il faut écrire ville sans guillemets.'),
  b('Une ligne contient une erreur. Laquelle ?',['points = 5','points = 8','print(point)'],2,'La variable s’appelle points, avec un s. Le nom doit être écrit exactement pareil partout.'),

 {cards:[
  {h:'Les trois familles en Python',p:['En Python, vrai s’écrit `True` et faux s’écrit `False`, avec une **majuscule** et sans guillemets.'],code:['age = 25','prix = 9.99','prenom = "Léa"','majeur = True']},
  {h:'Le piège du texte',p:['Entre deux nombres, `+` additionne. Entre deux textes, `+` les colle bout à bout.','"2" avec des guillemets est un texte, pas un nombre.'],code:['print(2 + 3)','print("2" + "3")'],out:['5','23']}],
 ex:[
  q('Quelle est la famille de la valeur True ?',null,['Booléen','Nombre','Texte','Commentaire'],'Un booléen ne peut valoir que `True` (vrai) ou `False` (faux).'),
  q('Que va afficher ce code ?',['print("2" + "3")'],['23','5','2 + 3','Une erreur'],'Ce sont deux textes : `+` les colle bout à bout.'),
  q('Que va afficher ce code ?',['print(2 + 3)'],['5','23','2 + 3','Une erreur'],'Ce sont deux nombres : `+` les additionne.'),
  b('Une ligne contient une erreur. Laquelle ?',['age = 25','majeur = true','print(majeur)'],1,'En Python, vrai s’écrit `True` avec une majuscule. Écrit en minuscules, Python croit que c’est un nom de variable qui n’existe pas.'),
  q('Laquelle de ces valeurs est un texte ?',null,['"42"','42','True','4.2'],'Ce qui est entre guillemets est toujours un texte, même si ça ressemble à un nombre.')]},

 {cards:[
  {h:'Calculer en Python',p:['`/` donne toujours un résultat à virgule : `7 / 2` vaut 3.5.','`//` fait une division entière : on garde seulement la partie avant la virgule. `7 // 2` vaut 3.'],code:['print(7 / 2)','print(7 // 2)','print(7 % 2)','print(2 + 3 * 4)'],out:['3.5','3','1','14']},
  {h:'Modifier une variable avec un calcul',p:['`score = score + 5` se lit de droite à gauche : on prend la valeur actuelle, on ajoute 5, puis on range le résultat dans la même boîte.','`score += 5` fait exactement la même chose, en plus court.'],code:['score = 10','score = score + 5','score += 5','print(score)'],out:['20']}],
 ex:[
  q('Que va afficher ce code ?',['print(2 + 3 * 4)'],['14','20','24','9'],'La multiplication passe en premier : 3 × 4 = 12, puis 2 + 12 = 14.'),
  q('Que va afficher ce code ?',['print(7 % 2)'],['1','3.5','3','0'],'`%` donne le reste de la division : 7 = 3 × 2 + 1, il reste 1.'),
  q('Que va afficher ce code ?',['print(7 // 2)'],['3','3.5','4','1'],'`//` est la division entière : on garde 3 et on laisse tomber ce qui suit la virgule.'),
  q('Que va afficher ce code ?',['s = 10','s += 5','print(s)'],['15','10','5','105'],'`s += 5` ajoute 5 à la valeur actuelle : 10 + 5 = 15.'),
  q('Que va afficher ce code ?',['print(7 / 2)'],['3.5','3','4','1'],'Avec un seul `/`, Python garde la partie après la virgule.')]},

 {cards:[
  {h:'Coller avec +',p:['Le signe `+` colle deux textes. Pense à mettre l’espace à l’intérieur des guillemets, sinon les mots seront collés.','Attention : en Python, `+` ne peut pas coller un texte et un nombre. `"Age : " + 25` provoque une erreur.'],code:['prenom = "Léa"','print("Bonjour " + prenom)'],out:['Bonjour Léa']},
  {h:'Le texte à trous',p:['On écrit la lettre `f` juste avant le premier guillemet. À l’intérieur, `{nom}` est remplacé par la valeur de la variable.','Ça marche avec du texte comme avec des nombres. C’est la façon la plus simple.'],code:['age = 20','print(f"Tu as {age} ans")'],out:['Tu as 20 ans']}],
 ex:[
  q('Que va afficher ce code ?',['p = "Tom"','print("Salut " + p)'],['Salut Tom','Salut p','SalutTom','Salut + Tom'],'`+` colle le texte "Salut " (avec son espace) et la valeur de p.'),
  q('Que va afficher ce code ?',['age = 20','print(f"Tu as {age} ans")'],['Tu as 20 ans','Tu as {age} ans','Tu as age ans','Une erreur'],'Grâce au f devant les guillemets, `{age}` est remplacé par la valeur de age.'),
  q('Attention, le f a disparu. Que va afficher ce code ?',['age = 20','print("Tu as {age} ans")'],['Tu as {age} ans','Tu as 20 ans','Tu as age ans','Une erreur'],'Sans le f devant les guillemets, rien n’est remplacé : le texte est affiché tel quel.'),
  t('Complète pour que {score} soit remplacé par sa valeur.',['score = 12','print(___"Score : {score}")'],['f','$','s','&'],'En Python, c’est la lettre `f` devant les guillemets qui active le remplacement.'),
  v('En Python, cette ligne fonctionne sans erreur : print("Age : " + 25)',null,false,'Python refuse de coller un texte et un nombre avec `+`. On écrit plutôt print(f"Age : {25}") ou on utilise une variable dans un texte à trous.')]},

 {cards:[
  {h:'if et else',p:['Après `if`, on écrit la question, puis **deux-points**. Les lignes décalées de 4 espaces en dessous sont exécutées si la réponse est oui.','Après `else:` (sinon) : ce qu’il faut faire si la réponse est non.','Ce décalage s’appelle l’**indentation**. En Python, il est obligatoire : c’est lui qui indique quelles lignes font partie du bloc.'],code:['age = 18','if age >= 18:','    print("Majeur")','else:','    print("Mineur")'],out:['Majeur']},
  {h:'Poser une question',p:['`>` plus grand, `<` plus petit, `>=` plus grand ou égal, `<=` plus petit ou égal.','`==` teste si deux valeurs sont égales. `!=` teste si elles sont différentes.','Ne confonds pas : un seul `=` range une valeur dans une boîte, deux `==` posent une question.']},
  {h:'Plus de deux chemins',p:['Avec `elif` (sinon si), on ajoute d’autres questions. L’ordinateur s’arrête à la première réponse vraie et ignore la suite.'],code:['t = 20','if t > 30:','    print("Chaud")','elif t > 15:','    print("Doux")','else:','    print("Froid")'],out:['Doux']}],
 ex:[
  q('Que va afficher ce code ?',['note = 12','if note >= 10:','    print("Réussi")','else:','    print("Raté")'],['Réussi','Raté','Réussi puis Raté','Rien du tout'],'12 est plus grand ou égal à 10 : la condition est vraie, on exécute le premier bloc seulement.'),
  t('On veut tester si age est égal à 18.',['if age ___ 18:'],['==','=','===','=>'],'En Python, `==` pose la question « est-ce égal ? ». Un seul `=` sert à ranger une valeur.'),
  q('Que va afficher ce code ?',['t = 5','if t > 30:','    print("Chaud")','elif t > 15:','    print("Doux")','else:','    print("Froid")'],['Froid','Doux','Chaud','Rien du tout'],'5 n’est pas plus grand que 30, ni plus grand que 15. On arrive donc dans le else.'),
  b('Une ligne contient une erreur. Laquelle ?',['age = 20','if age >= 18','    print("Majeur")'],1,'Il manque les deux-points à la fin de la ligne du if.'),
  q('Que va afficher ce code ?',['print(5 > 3)'],['True','true','5','2'],'Une comparaison donne un booléen. En Python il s’affiche avec une majuscule : True.'),
  o('S’il pleut, on affiche Parapluie, sinon Lunettes. Remets les lignes dans l’ordre.',['pluie = True','if pluie == True:','    print("Parapluie")','else:','    print("Lunettes")'],'On crée d’abord la variable, puis on pose la question, puis vient le cas « oui », et enfin le cas « sinon ».')]},

 {cards:[
  {h:'La boucle for',p:['`range(3)` fabrique la suite 0, 1, 2 : trois nombres, en partant de 0.','À chaque tour, la variable `i` prend le nombre suivant. Les lignes décalées de 4 espaces sont répétées.','Pour choisir le départ : `range(1, 4)` donne 1, 2, 3. Le dernier nombre (4) n’est jamais inclus.'],code:['for i in range(3):','    print(i)'],out:['0','1','2']},

 ex:[

  q('Que va afficher ce code ? (un nombre par ligne)',['for i in range(3):','    print(i)'],['0 1 2','1 2 3','0 1 2 3','3 3 3'],'`range(3)` commence à 0 et s’arrête avant 3.'),
  q('Que va afficher ce code ? (un nombre par ligne)',['for i in range(1, 4):','    print(i)'],['1 2 3','1 2 3 4','0 1 2 3','1 4'],'`range(1, 4)` commence à 1 et s’arrête avant 4.'),
  q('Que va afficher ce code ? (un nombre par ligne)',['n = 3','while n > 0:','    print(n)','    n = n - 1'],['3 2 1','3 2 1 0','1 2 3','3 3 3 sans fin'],'On affiche n puis on enlève 1. Quand n vaut 0, la condition n > 0 est fausse : on s’arrête sans afficher 0.'),
  b('Une ligne contient une erreur. Laquelle ?',['for i in range(3):','print(i)'],1,'La ligne à répéter doit être décalée de 4 espaces. Sans ce décalage, Python ne sait pas qu’elle fait partie de la boucle.'),
  o('On veut calculer 1 + 2 + 3, puis afficher le total une seule fois. Remets les lignes dans l’ordre.',['total = 0','for i in range(1, 4):','    total = total + i','print(total)'],'On part de 0, on ajoute chaque nombre dans la boucle, puis on affiche après la boucle (la dernière ligne n’est pas décalée).')]},

 {cards:[
  {h:'Créer une liste',p:['On met les valeurs entre crochets `[ ]`, séparées par des virgules.','Pour lire un élément, on écrit le nom de la liste puis son index entre crochets.','`len(liste)` donne le nombre d’éléments.'],code:['fruits = ["pomme", "banane", "kiwi"]','print(fruits[0])','print(len(fruits))'],out:['pomme','3']},
  {h:'Ajouter et parcourir',p:['`.append(valeur)` ajoute un élément à la fin de la liste.','`for fruit in fruits:` fait un tour de boucle pour chaque élément. À chaque tour, la variable fruit contient l’élément suivant.'],code:['fruits = ["pomme", "banane"]','fruits.append("kiwi")','for fruit in fruits:','    print(fruit)'],out:['pomme','banane','kiwi']}],
 ex:[
  q('Que va afficher ce code ?',['f = ["pomme", "banane", "kiwi"]','print(f[1])'],['banane','pomme','kiwi','Une erreur'],'On compte à partir de 0 : l’index 1 est le deuxième élément.'),
  t('Complète pour afficher le nombre d’éléments.',['fruits = ["pomme", "banane", "kiwi"]','print(___(fruits))'],['len','length','count','size'],'`len` (comme « length », longueur) donne le nombre d’éléments.'),
  t('Complète pour ajouter fraise à la fin de la liste.',['fruits.___("fraise")'],['append','push','add','plus'],'En Python, on ajoute à la fin d’une liste avec `.append`.'),
  q('Que va afficher ce code ?',['n = [10, 20]','n.append(30)','print(n[2])'],['30','20','10','Une erreur'],'Après append, la liste contient 10, 20, 30. L’index 2 est le troisième élément.'),
  q('Dans une liste de 3 éléments, quel est l’index du dernier ?',null,['2','3','1','0'],'Les index sont 0, 1 et 2. Le dernier index vaut toujours le nombre d’éléments moins 1.'),
  q('Combien de fois Miam va-t-il s’afficher ?',['plats = ["riz", "pâtes", "soupe"]','for plat in plats:','    print("Miam")'],['3 fois','1 fois','2 fois','4 fois'],'La boucle fait un tour par élément, et la liste en contient 3.')]},

 {cards:[
  {h:'Créer et appeler une fonction',p:['`def` crée la fonction. Ensuite viennent son nom, ses paramètres entre parenthèses, puis deux-points.','Les lignes décalées de 4 espaces forment le contenu de la fonction. `return` renvoie le résultat.','Pour l’utiliser, on écrit son nom avec une valeur entre parenthèses : `doubler(4)`.'],code:['def doubler(n):','    return n * 2','','print(doubler(4))'],out:['8']},
  {h:'Plusieurs paramètres, plusieurs appels',p:['On sépare les paramètres par des virgules. On peut appeler la même fonction autant de fois qu’on veut, avec des valeurs différentes.','En Python, la fonction doit être créée **avant** la ligne qui l’appelle.'],code:['def ajouter(a, b):','    return a + b','','print(ajouter(2, 3))','print(ajouter(10, 1))'],out:['5','11']}],
 ex:[
  q('Que va afficher ce code ?',['def ajouter(a, b):','    return a + b','','print(ajouter(2, 3))'],['5','23','a + b','Rien du tout'],'a reçoit 2, b reçoit 3, et la fonction renvoie 2 + 3.'),
  t('Complète pour créer la fonction.',['___ dire_bonjour():','    print("Bonjour")'],['def','function','func','fun'],'En Python, on crée une fonction avec le mot `def`.'),
  q('Que va afficher ce code ?',['def saluer():','    print("Salut")'],['Rien du tout','Salut','saluer','Une erreur'],'La fonction est créée mais jamais appelée. Il faudrait ajouter la ligne saluer() pour qu’elle s’exécute.'),
  o('Remets les lignes dans l’ordre pour créer la fonction triple, puis afficher le triple de 2.',['def triple(n):','    return n * 3','print(triple(2))'],'On crée d’abord la fonction (la ligne def puis son contenu décalé), et seulement ensuite on l’appelle.'),
  q('Que va afficher ce code ?',['def carre(n):','    return n * n','','print(carre(3) + 1)'],['10','9','7','31'],'carre(3) renvoie 3 × 3 = 9, puis on ajoute 1.')]}
],

/* ---------------- C# ---------------- */
cs:[
 {cards:[
  {h:'Afficher avec Console.WriteLine',p:['Pour afficher un message, on écrit `Console.WriteLine`, puis le message entre parenthèses.','En C#, les majuscules comptent : `Console` avec un C majuscule, `WriteLine` avec un W et un L majuscules.','Le texte se met entre guillemets, et chaque instruction se termine **obligatoirement** par un point-virgule.'],code:['Console.WriteLine("Bonjour !");'],out:['Bonjour !'],tip:'Dans les versions récentes de C#, ces lignes s’écrivent directement dans le fichier Program.cs, sans rien autour.'},
  {h:'Les commentaires',p:['Une ligne qui commence par `//` est un commentaire : une note pour les humains. L’ordinateur l’ignore complètement.'],code:['// Cette ligne est ignorée','Console.WriteLine("Celle-ci est exécutée");'],out:['Celle-ci est exécutée']}],
 ex:[
  q('Que va afficher ce code ?',['Console.WriteLine("Salut");'],['Salut','"Salut"','Console.WriteLine','Rien du tout'],'Les guillemets servent à délimiter le texte dans le code. Ils ne sont pas affichés.'),
  t('Complète pour afficher Coucou.',['Console.___("Coucou");'],['WriteLine','writeline','Print','Log'],'L’instruction est `Console.WriteLine`, avec W et L en majuscules.'),
  b('Une ligne contient une erreur. Laquelle ?',['Console.WriteLine("Un");','Console.WriteLine("Deux")','Console.WriteLine("Trois");'],1,'Il manque le point-virgule à la fin de la ligne. En C#, il est obligatoire.'),
  o('Remets les lignes dans l’ordre pour afficher 1, puis 2, puis 3.',['Console.WriteLine("1");','Console.WriteLine("2");','Console.WriteLine("3");'],'L’ordinateur exécute les lignes de haut en bas.'),
  q('Que va afficher ce code ?',['// Console.WriteLine("A");','Console.WriteLine("B");'],['B','A','A puis B','Rien du tout'],'La première ligne commence par `//` : c’est un commentaire, elle est ignorée.'),
  v('En C#, on peut aussi écrire console.writeline tout en minuscules.',null,false,'Non. C# fait la différence entre majuscules et minuscules : il faut écrire exactement Console.WriteLine.')]},

 {cards:[
  {h:'Le type d’abord',p:['En C#, on écrit d’abord le **type** de la valeur, puis le nom de la variable, puis la valeur.','`int` veut dire nombre entier. `string` veut dire texte.','Pour utiliser la valeur, on écrit simplement le nom de la variable, **sans guillemets**.'],code:['int age = 25;','string prenom = "Léa";','Console.WriteLine(age);'],out:['25']},
  {h:'Changer la valeur',p:['Pour remplacer la valeur, on réécrit le nom, le signe `=` et la nouvelle valeur. On ne répète pas le type.','Le type d’une variable ne change jamais : une variable `int` ne peut contenir que des nombres entiers.'],code:['int score = 10;','score = 20;','Console.WriteLine(score);'],out:['20']}],
 ex:[
  q('Que va afficher ce code ?',['int score = 10;','score = 20;','Console.WriteLine(score);'],['20','10','30','score'],'La deuxième ligne remplace 10 par 20 dans la boîte score.'),
  t('Complète pour créer une variable qui contient un nombre entier.',['___ age = 25;'],['int','string','let','number'],'`int` est le type des nombres entiers.'),
  t('Complète pour créer une variable qui contient du texte.',['___ prenom = "Léa";'],['string','int','text','bool'],'`string` est le type du texte.'),
  b('Une ligne contient une erreur. Laquelle ?',['int points = 5;','points = 8;','Console.WriteLine(point);'],2,'La variable s’appelle points, avec un s. Le nom doit être écrit exactement pareil partout.'),
  q('Que va afficher ce code ?',['string ville = "Paris";','Console.WriteLine("ville");'],['ville','Paris','"Paris"','Une erreur'],'Avec des guillemets, "ville" est un simple texte. Pour afficher le contenu de la variable, il faut écrire ville sans guillemets.'),
  v('En C#, chaque variable a un type précis (int, string…) qui ne change jamais.',null,true,'Oui. C’est pour ça qu’on ne peut pas ranger un texte dans une variable `int`.')]},

 {cards:[
  {h:'Un type pour chaque famille',p:['`int` : nombre entier. `double` : nombre à virgule. `string` : texte. `bool` : booléen.','En C#, vrai s’écrit `true` et faux s’écrit `false`, sans guillemets.'],code:['int age = 25;','double prix = 9.99;','string prenom = "Léa";','bool majeur = true;']},
  {h:'Le piège du texte',p:['Entre deux nombres, `+` additionne. Entre deux textes, `+` les colle bout à bout.','"2" avec des guillemets est un texte, pas un nombre.'],code:['Console.WriteLine(2 + 3);','Console.WriteLine("2" + "3");'],out:['5','23']}],
 ex:[
  t('Quel type pour un nombre à virgule ?',['___ prix = 9.99;'],['double','int','string','bool'],'`double` est le type des nombres à virgule. `int` n’accepte que les nombres entiers.'),
  t('Quel type pour une valeur vrai ou faux ?',['___ majeur = true;'],['bool','int','string','double'],'`bool` est le type des booléens : `true` ou `false`.'),
  q('Que va afficher ce code ?',['Console.WriteLine("2" + "3");'],['23','5','2 + 3','Une erreur'],'Ce sont deux textes : `+` les colle bout à bout.'),
  b('Une ligne contient une erreur. Laquelle ?',['int age = 25;','string prenom = Léa;','bool majeur = true;'],1,'Il manque les guillemets autour de Léa. Un texte doit toujours être entre guillemets.'),
  q('Quel type choisir pour ranger le nombre entier 7 ?',null,['int','string','bool','text'],'`int` est le type des nombres entiers.'),
  b('Une ligne contient une erreur. Laquelle ?',['int age = "25";','string ville = "Lyon";','bool ouvert = false;'],0,'"25" entre guillemets est un texte. On ne peut pas ranger un texte dans une variable de type `int`.')]},

 {cards:[
  {h:'Calculer en C#',p:['Piège du C# : quand on divise deux nombres **entiers**, le résultat est un entier. La partie après la virgule est coupée : `7 / 2` vaut 3.','Pour obtenir trois et demi, il faut au moins un nombre à virgule dans le calcul : `7.0 / 2`.'],code:['Console.WriteLine(7 / 2);','Console.WriteLine(7 % 2);','Console.WriteLine(2 + 3 * 4);'],out:['3','1','14']},
  {h:'Modifier une variable avec un calcul',p:['`score = score + 5` se lit de droite à gauche : on prend la valeur actuelle, on ajoute 5, puis on range le résultat dans la même boîte.','`score += 5` fait exactement la même chose, en plus court.'],code:['int score = 10;','score = score + 5;','score += 5;','Console.WriteLine(score);'],out:['20']}],
 ex:[
  q('Que va afficher ce code ?',['Console.WriteLine(2 + 3 * 4);'],['14','20','24','9'],'La multiplication passe en premier : 3 × 4 = 12, puis 2 + 12 = 14.'),
  q('Que va afficher ce code ?',['Console.WriteLine(7 % 2);'],['1','3.5','3','0'],'`%` donne le reste de la division : 7 = 3 × 2 + 1, il reste 1.'),
  q('Attention au piège. Que va afficher ce code ?',['Console.WriteLine(7 / 2);'],['3','3.5','4','1'],'7 et 2 sont deux entiers : en C#, le résultat est un entier, la partie après la virgule est coupée.'),
  q('Que va afficher ce code ?',['int s = 10;','s += 5;','Console.WriteLine(s);'],['15','10','5','105'],'`s += 5` ajoute 5 à la valeur actuelle : 10 + 5 = 15.'),
  v('En C#, diviser deux nombres entiers donne toujours un nombre entier.',null,true,'Oui. Pour garder la partie après la virgule, il faut qu’au moins un des deux nombres soit à virgule, comme 7.0.')]},

 {cards:[
  {h:'Coller avec +',p:['Le signe `+` colle un texte et une variable. Pense à mettre l’espace à l’intérieur des guillemets, sinon les mots seront collés.'],code:['string prenom = "Léa";','Console.WriteLine("Bonjour " + prenom);'],out:['Bonjour Léa']},
  {h:'Le texte à trous',p:['On écrit le signe `$` juste avant le premier guillemet. À l’intérieur, `{nom}` est remplacé par la valeur de la variable.'],code:['int age = 20;','Console.WriteLine($"Tu as {age} ans");'],out:['Tu as 20 ans']}],
 ex:[
  q('Que va afficher ce code ?',['string p = "Tom";','Console.WriteLine("Salut " + p);'],['Salut Tom','Salut p','SalutTom','Salut + Tom'],'`+` colle le texte "Salut " (avec son espace) et la valeur de p.'),
  q('Que va afficher ce code ?',['int age = 20;','Console.WriteLine($"Tu as {age} ans");'],['Tu as 20 ans','Tu as {age} ans','Tu as age ans','Une erreur'],'Grâce au $ devant les guillemets, `{age}` est remplacé par la valeur de age.'),
  q('Attention, le $ a disparu. Que va afficher ce code ?',['int age = 20;','Console.WriteLine("Tu as {age} ans");'],['Tu as {age} ans','Tu as 20 ans','Tu as age ans','Une erreur'],'Sans le $ devant les guillemets, rien n’est remplacé : le texte est affiché tel quel.'),
  t('Complète pour que {score} soit remplacé par sa valeur.',['int score = 12;','Console.WriteLine(___"Score : {score}");'],['$','f','#','&'],'En C#, c’est le signe `$` devant les guillemets qui active le remplacement.'),
  q('Que va afficher ce code ?',['Console.WriteLine("Age : " + 25);'],['Age : 25','Age : + 25','25','Une erreur'],'C# transforme tout seul le nombre 25 en texte pour le coller.')]},

 {cards:[
  {h:'if et else',p:['Entre parenthèses : la question posée. Entre accolades `{ }` : ce qu’il faut faire si la réponse est oui.','Après `else` (sinon) : ce qu’il faut faire si la réponse est non.'],code:['int age = 18;','if (age >= 18)','{','    Console.WriteLine("Majeur");','}','else','{','    Console.WriteLine("Mineur");','}'],out:['Majeur']},
  {h:'Poser une question',p:['`>` plus grand, `<` plus petit, `>=` plus grand ou égal, `<=` plus petit ou égal.','`==` teste si deux valeurs sont égales. `!=` teste si elles sont différentes.','Ne confonds pas : un seul `=` range une valeur dans une boîte, deux `==` posent une question.']},
  {h:'Plus de deux chemins',p:['Avec `else if` (sinon si), on ajoute d’autres questions. L’ordinateur s’arrête à la première réponse vraie et ignore la suite.'],code:['int t = 20;','if (t > 30) {','    Console.WriteLine("Chaud");','} else if (t > 15) {','    Console.WriteLine("Doux");','} else {','    Console.WriteLine("Froid");','}'],out:['Doux']}],
 ex:[
  q('Que va afficher ce code ?',['int note = 12;','if (note >= 10) {','    Console.WriteLine("Réussi");','} else {','    Console.WriteLine("Raté");','}'],['Réussi','Raté','Réussi puis Raté','Rien du tout'],'12 est plus grand ou égal à 10 : la condition est vraie, on exécute le premier bloc seulement.'),
  t('On veut tester si age est égal à 18.',['if (age ___ 18) {'],['==','=','===','=>'],'En C#, `==` pose la question « est-ce égal ? ». Un seul `=` sert à ranger une valeur.'),
  q('Que va afficher ce code ?',['int t = 5;','if (t > 30) {','    Console.WriteLine("Chaud");','} else if (t > 15) {','    Console.WriteLine("Doux");','} else {','    Console.WriteLine("Froid");','}'],['Froid','Doux','Chaud','Rien du tout'],'5 n’est pas plus grand que 30, ni plus grand que 15. On arrive donc dans le else.'),
  b('Une ligne contient une erreur. Laquelle ?',['int age = 20;','if age >= 18 {','    Console.WriteLine("Majeur");','}'],1,'En C#, la question du if doit être entre parenthèses : if (age >= 18).'),
  q('Que va afficher ce code ?',['Console.WriteLine(5 > 3);'],['True','true','5','2'],'Une comparaison donne un booléen. Dans le code on écrit `true`, mais à l’affichage C# écrit True avec une majuscule.'),
  o('S’il pleut, on affiche Parapluie, sinon Lunettes. Remets les lignes dans l’ordre.',['bool pluie = true;','if (pluie == true) {','    Console.WriteLine("Parapluie");','} else {','    Console.WriteLine("Lunettes");','}'],'On crée d’abord la variable, puis on pose la question, puis vient le cas « oui », et enfin le cas « sinon ».')]},

 {cards:[
  {h:'La boucle for',p:['Entre parenthèses, trois morceaux séparés par des points-virgules :','`int i = 1` : on démarre un compteur à 1.','`i <= 3` : on continue tant que le compteur ne dépasse pas 3.','`i++` : après chaque tour, on ajoute 1 au compteur.'],code:['for (int i = 1; i <= 3; i++)','{','    Console.WriteLine(i);','}'],out:['1','2','3']},
  {h:'La boucle while',p:['`while` répète le bloc tant que la condition est vraie.','Il faut que quelque chose change à chaque tour (ici n diminue). Sinon la condition reste vraie pour toujours et la boucle ne s’arrête jamais.'],code:['int n = 3;','while (n > 0)','{','    Console.WriteLine(n);','    n = n - 1;','}'],out:['3','2','1']}],
 ex:[
  q('Combien de fois Hop va-t-il s’afficher ?',['for (int i = 0; i < 4; i++) {','    Console.WriteLine("Hop");','}'],['4 fois','3 fois','5 fois','1 fois'],'Le compteur vaut 0, 1, 2 puis 3 : ça fait 4 tours. À 4, la condition i < 4 devient fausse.'),
  q('Que va afficher ce code ? (un nombre par ligne)',['for (int i = 1; i <= 3; i++) {','    Console.WriteLine(i);','}'],['1 2 3','0 1 2','1 2 3 4','3 3 3'],'Le compteur démarre à 1 et s’arrête après 3.'),
  q('Que va afficher ce code ? (un nombre par ligne)',['int n = 3;','while (n > 0) {','    Console.WriteLine(n);','    n = n - 1;','}'],['3 2 1','3 2 1 0','1 2 3','3 3 3 sans fin'],'On affiche n puis on enlève 1. Quand n vaut 0, la condition n > 0 est fausse : on s’arrête sans afficher 0.'),
  t('Complète pour créer le compteur de la boucle.',['for (___ i = 0; i < 5; i++) {'],['int','let','string','for'],'Le compteur est un nombre entier : son type est `int`.'),
  q('Que va afficher ce code ?',['int total = 0;','for (int i = 1; i <= 3; i++) {','    total = total + i;','}','Console.WriteLine(total);'],['6','3','123','0'],'À chaque tour on ajoute le compteur au total : 0 + 1 + 2 + 3 = 6.'),
  v('Une boucle while dont la condition reste toujours vraie ne s’arrête jamais.',null,true,'On appelle ça une boucle infinie. Il faut toujours vérifier que la condition finira par devenir fausse.')]},

 {cards:[
  {h:'Créer une liste',p:['`List<string>` veut dire « liste de textes ». Entre les chevrons `< >`, on indique le type des éléments.','Pour lire un élément, on écrit le nom de la liste puis son index entre crochets.','`.Count` donne le nombre d’éléments.'],code:['List<string> fruits = new List<string> { "pomme", "banane", "kiwi" };','Console.WriteLine(fruits[0]);','Console.WriteLine(fruits.Count);'],out:['pomme','3'],tip:'Si C# ne reconnaît pas le mot List, ajoute tout en haut du fichier la ligne : using System.Collections.Generic; (les projets récents l’ajoutent tout seuls).'},
  {h:'Ajouter et parcourir',p:['`.Add(valeur)` ajoute un élément à la fin de la liste.','`foreach (string fruit in fruits)` fait un tour de boucle pour chaque élément. À chaque tour, la variable fruit contient l’élément suivant.'],code:['List<string> fruits = new List<string> { "pomme", "banane" };','fruits.Add("kiwi");','foreach (string fruit in fruits)','{','    Console.WriteLine(fruit);','}'],out:['pomme','banane','kiwi']}],
 ex:[
  q('Que va afficher ce code ?',['List<string> f = new List<string> { "pomme", "banane", "kiwi" };','Console.WriteLine(f[1]);'],['banane','pomme','kiwi','Une erreur'],'On compte à partir de 0 : l’index 1 est le deuxième élément.'),
  t('Complète pour afficher le nombre d’éléments de la liste.',['Console.WriteLine(fruits.___);'],['Count','Size','Total','Number'],'Pour une `List`, le nombre d’éléments s’obtient avec `.Count`.'),
  t('Complète pour ajouter fraise à la fin de la liste.',['fruits.___("fraise");'],['Add','Push','add','Plus'],'En C#, on ajoute à la fin d’une liste avec `.Add`, avec un A majuscule.'),
  q('Que va afficher ce code ?',['List<int> n = new List<int> { 10, 20 };','n.Add(30);','Console.WriteLine(n[2]);'],['30','20','10','Une erreur'],'Après Add, la liste contient 10, 20, 30. L’index 2 est le troisième élément.'),
  q('Dans une liste de 3 éléments, quel est l’index du dernier ?',null,['2','3','1','0'],'Les index sont 0, 1 et 2. Le dernier index vaut toujours le nombre d’éléments moins 1.'),
  q('Combien de fois Miam va-t-il s’afficher ?',['List<string> plats = new List<string> { "riz", "pâtes", "soupe" };','foreach (string plat in plats) {','    Console.WriteLine("Miam");','}'],['3 fois','1 fois','2 fois','4 fois'],'La boucle fait un tour par élément, et la liste en contient 3.')]},

 {cards:[
  {h:'Créer et appeler une fonction',p:['Le premier mot est le type du résultat : ici `int`, car la fonction renvoie un nombre entier.','Ensuite viennent le nom, puis les paramètres entre parenthèses, chacun avec son type.','`return` renvoie le résultat. Pour utiliser la fonction, on écrit son nom avec une valeur : `Doubler(4)`.'],code:['int Doubler(int n)','{','    return n * 2;','}','','Console.WriteLine(Doubler(4));'],out:['8']},
  {h:'Une fonction qui ne renvoie rien',p:['Si la fonction ne renvoie aucun résultat (par exemple, elle affiche juste un message), on écrit `void` à la place du type.'],code:['void DireBonjour()','{','    Console.WriteLine("Bonjour");','}','','DireBonjour();'],out:['Bonjour']}],
 ex:[
  q('Que va afficher ce code ?',['int Ajouter(int a, int b)','{','    return a + b;','}','','Console.WriteLine(Ajouter(2, 3));'],['5','23','a + b','Rien du tout'],'a reçoit 2, b reçoit 3, et la fonction renvoie 2 + 3.'),
  t('La fonction renvoie un nombre entier. Complète.',['___ Doubler(int n)','{','    return n * 2;','}'],['int','void','string','function'],'On écrit devant le nom le type du résultat : `int` pour un nombre entier.'),
  t('La fonction ne renvoie rien. Complète.',['___ DireBonjour()','{','    Console.WriteLine("Bonjour");','}'],['void','int','null','function'],'`void` indique que la fonction ne renvoie aucun résultat.'),
  q('Que va afficher ce code ?',['void Saluer()','{','    Console.WriteLine("Salut");','}'],['Rien du tout','Salut','Saluer','Une erreur'],'La fonction est créée mais jamais appelée. Il faudrait ajouter la ligne Saluer(); pour qu’elle s’exécute.'),
  q('Que va afficher ce code ?',['int Carre(int n)','{','    return n * n;','}','','Console.WriteLine(Carre(3) + 1);'],['10','9','7','31'],'Carre(3) renvoie 3 × 3 = 9, puis on ajoute 1.')]}
]};

 {h:'Combiner plusieurs questions',p:['Parfois une seule question ne suffit pas. Pour monter dans un manège, il faut avoir plus de 10 ans **et** mesurer plus de 140 cm.','**ET** : vrai seulement si les deux côtés sont vrais.','**OU** : vrai dès qu’au moins un des deux côtés est vrai.','**NON** : inverse la valeur. Vrai devient faux, faux devient vrai.']},
 {h:'Le texte a ses propres outils',p:['Chaque langage fournit des outils tout prêts pour travailler avec du texte : compter les caractères, passer en majuscules, vérifier si un mot est présent.','Ces outils ne modifient pas le texte d’origine : ils fabriquent un **nouveau** texte, qu’on peut afficher ou ranger dans une variable.']},
 {h:'Retrouver une valeur par son nom',p:['Dans une liste, on retrouve une valeur grâce à son numéro. Dans un **dictionnaire**, on la retrouve grâce à un nom, appelé **clé**.','Comme dans un vrai dictionnaire : on cherche un mot (la clé) et on trouve sa définition (la valeur).','Exemple : un carnet d’âges, où la clé "Léa" donne la valeur 25.']},
 {h:'Contrôler une boucle de l’intérieur',p:['Deux mots permettent de changer le déroulement d’une boucle.','`break` : on arrête la boucle tout de suite, même s’il restait des tours. Comme arrêter de chercher ses clés dès qu’on les a trouvées.','`continue` : on abandonne le tour en cours et on passe directement au tour suivant.']},
 {h:'Quand le programme plante',p:['Certaines opérations peuvent échouer pendant que le programme tourne : transformer le texte "abc" en nombre, diviser par zéro, utiliser quelque chose qui n’existe pas…','Par défaut, une erreur arrête tout le programme. Pour éviter ça, on **essaie** le code risqué, et on prévoit quoi faire **si ça échoue**.','C’est comme un filet de sécurité sous un trapéziste.']},
 {h:'Une classe, c’est un plan de fabrication',p:['Une **classe** est un plan. Elle décrit ce que possède une chose (ses **données**) et ce qu’elle sait faire (ses **méthodes**, des fonctions rangées dans la classe).','Un **objet** est un exemplaire fabriqué à partir de ce plan. Avec un seul plan « Chien », on peut créer autant de chiens qu’on veut, chacun avec son propre nom.','C’est la base de la programmation orientée objet, utilisée dans presque tous les vrais logiciels.']},
 {h:'Ton premier vrai programme',p:['FizzBuzz est un exercice célèbre, souvent posé en entretien d’embauche. Tu as maintenant tout ce qu’il faut pour le comprendre.','La règle : on compte de 1 à 15. Pour un multiple de 3, on affiche Fizz à la place du nombre. Pour un multiple de 5, on affiche Buzz. Pour un multiple des deux, on affiche FizzBuzz.','Les outils : une boucle pour compter, des conditions pour choisir, et `%` pour reconnaître les multiples.']}
);

 ()=>q(FZ+'Qu’affiche-t-on pour 15 ?',null,['FizzBuzz','Fizz','Buzz','15'],'15 = 3 × 5 : c’est un multiple de 3 et de 5 à la fois.'),
 ()=>q(FZ+'Qu’affiche-t-on pour 7 ?',null,['7','Fizz','Buzz','FizzBuzz'],'7 n’est un multiple ni de 3 ni de 5 : on affiche simplement le nombre.')];
